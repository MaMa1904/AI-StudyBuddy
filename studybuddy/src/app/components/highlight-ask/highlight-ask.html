@if (visible()) {
  <div
    class="highlight-popup"
    [style.top.px]="popupY()"
    [style.left.px]="popupX()"
    role="dialog"
    aria-label="AI explanation"
  >
    <div class="popup-header">
      <span><i class="ti ti-sparkles" aria-hidden="true"></i> AI Explanation</span>
      <button class="popup-close" (click)="close()" aria-label="Close">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>

    <div class="popup-selection">
      <i class="ti ti-quote" aria-hidden="true"></i>
      <span>{{ selectedText().slice(0, 80) }}{{ selectedText().length > 80 ? '...' : '' }}</span>
    </div>

    @if (isLoading()) {
      <div class="popup-loading">
        <i class="ti ti-loader" aria-hidden="true"></i> Explaining...
      </div>
    } @else if (answer()) {
      <div class="popup-answer">{{ answer() }}</div>
    }
  </div>
}
